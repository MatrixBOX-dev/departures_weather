<style>
:root{--bg:#0f0f0f;--s1:#161616;--s2:#1c1c1c;--bd:#282828;--tx:#ddd;--mu:#666;--ac:#00ff88;--wa:#ffaa00;--er:#ff4444}
#sw{font-family:"Segoe UI",system-ui,sans-serif;max-width:640px;margin:0 auto;padding:6px 0 36px;color:var(--tx)}
#sw *{box-sizing:border-box}
.sh{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 2px 14px;border-bottom:1px solid var(--bd)}
.sh h1{font-family:Georgia,serif;font-size:1.65rem;font-weight:400;margin:0}
.badge{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid var(--bd);background:var(--s2);color:var(--mu);transition:all .2s}
.badge.running{border-color:var(--ac);background:#041a0c;color:var(--ac)}
.badge.paused{border-color:var(--wa);background:#1a1200;color:var(--wa)}
.badge.finished{border-color:var(--er);background:#1a0404;color:var(--er)}
.preview{position:relative;margin:20px 0 16px;background:#000;border:1px solid #1e1e1e;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;overflow:hidden}
.digits{font-family:"Courier New",Courier,monospace;font-size:3.6rem;font-weight:700;letter-spacing:.05em;line-height:1;user-select:none;transition:opacity .1s}
.st-paused{opacity:.4}
.st-stopped{opacity:.65}
.prog-wrap{position:absolute;bottom:0;left:0;right:0;height:5px;background:#141414}
.prog-bar{height:100%;background:var(--ac);transition:width .12s linear}
.ctrls{display:flex;gap:10px;margin-bottom:20px}
.cbtn{flex:1;padding:13px 10px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font:700 .78rem "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .1s,border-color .1s}
.cbtn:hover{background:#222;border-color:#3a3a3a}
.cbtn.go{border-color:var(--ac);background:#041a0c;color:var(--ac)}
.cbtn.go:hover{background:#082214}
.cbtn.paus{border-color:var(--wa);background:#1a1200;color:var(--wa)}
.cbtn.paus:hover{background:#201800}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.panel{background:var(--s1);border:1px solid var(--bd);padding:15px}
.panel.full{grid-column:1/-1}
@media(max-width:480px){.panels{grid-template-columns:1fr}.panel.full{grid-column:auto}}
.ptitle{margin:0 0 11px;font-family:Georgia,serif;font-size:.9rem;font-weight:400;color:var(--tx)}
.row{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #1e1e1e;font-size:.82rem}
.row:first-of-type{border-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--bd);background:#0a0a0a;padding:3px;gap:3px}
.seg button{padding:8px 4px;border:0;background:transparent;color:var(--mu);font:600 .71rem "Segoe UI",system-ui,sans-serif;cursor:pointer;transition:background .1s,color .1s}
.seg button.on{background:var(--ac);color:#000}
.tog{position:relative;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;position:absolute}
.tok{position:absolute;inset:0;background:#2a2a2a;border-radius:20px;cursor:pointer;transition:.15s}
.tok:after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#666;border-radius:50%;transition:.15s}
.tog input:checked+.tok{background:#052a12}
.tog input:checked+.tok:after{background:var(--ac);transform:translateX(16px)}
.col-row{display:flex;align-items:center;gap:8px;font:600 .67rem "Courier New",monospace;color:var(--mu)}
.col-row input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--bd);background:#111;cursor:pointer;flex-shrink:0}
.preset-wrap{display:flex;gap:8px;margin-top:10px}
.preset-wrap input[type=text]{flex:1;padding:9px 10px;border:1px solid var(--bd);background:#0a0a0a;color:var(--tx);font:inherit;font-size:.85rem;outline:0}
.preset-wrap input[type=text]:focus{border-color:#3a3a3a}
.preset-wrap button{padding:9px 14px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font:600 .76rem "Segoe UI",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.preset-wrap button:hover{background:#222}
.sbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 12px;background:rgba(15,15,15,.96);border:1px solid var(--bd);backdrop-filter:blur(8px)}
.snote{font-size:.7rem;color:var(--mu)}
.sbtn{border:0;padding:10px 22px;background:var(--ac);color:#000;font:700 .76rem "Segoe UI",system-ui,sans-serif;cursor:pointer}
.sbtn:hover{opacity:.85}
</style>

<div id="sw">
  <header class="sh">
    <h1>Stopwatch</h1>
    <span class="badge" id="badge">â€”</span>
  </header>

  <div class="preview">
    <div class="digits st-stopped" id="digits" style="color:#00ff88">00:00.0</div>
    <div class="prog-wrap" id="prog-wrap" style="display:none">
      <div class="prog-bar" id="prog-bar" style="width:100%"></div>
    </div>
  </div>

  <div class="ctrls">
    <button class="cbtn go" id="btn-main" onclick="btnMain()">&#9654;&#xFE0E;  Start</button>
    <button class="cbtn" onclick="doAction('reset')">&#8635;  Reset</button>
  </div>

  <div class="panels">
    <section class="panel full">
      <h2 class="ptitle">Mode</h2>
      <div class="seg" id="seg-mode">
        <button id="m_stopwatch" onclick="setMode('stopwatch')">Stopwatch</button>
        <button id="m_countdown" onclick="setMode('countdown')">Countdown</button>
      </div>
      <div class="preset-wrap" id="preset-wrap" style="display:none">
        <input type="text" id="preset-val" placeholder="MM:SS or H:MM:SS">
        <button onclick="setPreset()">Set time</button>
      </div>
    </section>

    <section class="panel">
      <h2 class="ptitle">Display</h2>
      <div class="row"><span>Show tenths</span><label class="tog"><input type="checkbox" id="show_tenths" onchange="onTog(this)"><span class="tok"></span></label></div>
      <div class="row"><span>Scale</span></div>
      <div class="seg" id="seg-scale" style="margin-top:4px">
        <button id="sc_1" onclick="setScale(1)">1&#215;</button>
        <button id="sc_2" onclick="setScale(2)">2&#215;</button>
        <button id="sc_3" onclick="setScale(3)">3&#215;</button>
        <button id="sc_4" onclick="setScale(4)">4&#215;</button>
      </div>
    </section>

    <section class="panel">
      <h2 class="ptitle">Colors</h2>
      <div class="row"><span>Digits</span><label class="col-row"><input type="color" id="fg_hex" oninput="onColor(this)"><b id="fg-lbl"></b></label></div>
      <div class="row"><span>Background</span><label class="col-row"><input type="color" id="bg_hex" oninput="onColor(this)"><b id="bg-lbl"></b></label></div>
      <div class="row"><span>Accent / bar</span><label class="col-row"><input type="color" id="accent_hex" oninput="onColor(this)"><b id="ac-lbl"></b></label></div>
    </section>
  </div>

  <div class="sbar">
    <span class="snote" id="snote">Changes apply instantly on the display</span>
    <button class="sbtn" onclick="save()">Save settings</button>
  </div>
</div>

<script>
var swState="stopped",swMode="stopwatch",serverMs=0,lastPoll=0,presetMs=60000,tenths=true,fgColor="#00ff88",db;

function pad(n){return n<10?"0"+n:""+n}
function fmtMs(ms){
  ms=Math.max(0,ms);
  var ts=Math.floor(ms/1000),t=Math.floor((ms%1000)/100);
  var h=Math.floor(ts/3600),m=Math.floor((ts%3600)/60),s=ts%60;
  if(h>0) return h+":"+pad(m)+":"+pad(s);
  return tenths?pad(m)+":"+pad(s)+"."+t:pad(m)+":"+pad(s);
}
function liveMs(){
  if(swState!=="running") return serverMs;
  var e=Date.now()-lastPoll;
  return swMode==="countdown"?Math.max(0,serverMs-e):serverMs+e;
}

function tick(){
  var ms=liveMs();
  document.getElementById("digits").textContent=fmtMs(ms);
  if(swMode==="countdown"&&presetMs>0)
    document.getElementById("prog-bar").style.width=Math.max(0,Math.min(100,ms/presetMs*100))+"%";
  requestAnimationFrame(tick);
}

function poll(){
  fetch("/state").then(function(r){return r.json()}).then(function(d){
    swState=d.state; serverMs=d.ms; lastPoll=Date.now();
    swMode=d.mode; presetMs=d.preset_ms||presetMs;
    applyState();
  }).catch(function(){
    document.getElementById("badge").textContent="Offline";
    document.getElementById("badge").className="badge";
  });
  setTimeout(poll,300);
}

function applyState(){
  var btn=document.getElementById("btn-main");
  var dg=document.getElementById("digits");
  dg.className="digits"+(swState==="paused"?" st-paused":swState==="stopped"?" st-stopped":"");
  dg.style.color=swState==="finished"?"#ff4444":fgColor;
  document.getElementById("prog-wrap").style.display=swMode==="countdown"?"block":"none";
  var badge=document.getElementById("badge");
  if(swState==="running"){badge.className="badge running";badge.textContent="Running";btn.textContent="\u23F8  Pause";btn.className="cbtn paus"}
  else if(swState==="paused"){badge.className="badge paused";badge.textContent="Paused";btn.textContent="\u25B6\uFE0E  Resume";btn.className="cbtn go"}
  else if(swState==="finished"){badge.className="badge finished";badge.textContent="Done!";btn.textContent="\u8635  Reset";btn.className="cbtn go"}
  else{badge.className="badge";badge.textContent="Ready";btn.textContent="\u25B6\uFE0E  Start";btn.className="cbtn go"}
}

function post(qs){
  document.getElementById("snote").textContent="Updating\u2026";
  return fetch("/?"+qs,{method:"POST"}).then(function(){
    document.getElementById("snote").textContent="Changes apply instantly on the display";
  });
}
function doAction(a){post("action="+a)}
function btnMain(){
  if(swState==="running")      doAction("pause");
  else if(swState==="finished") doAction("reset");
  else                          doAction("start");
}
function setMode(m){
  swMode=m; post("mode="+m);
  document.querySelectorAll("#seg-mode button").forEach(function(b){b.classList.remove("on")});
  document.getElementById("m_"+m).classList.add("on");
  document.getElementById("preset-wrap").style.display=m==="countdown"?"flex":"none";
  document.getElementById("prog-wrap").style.display=m==="countdown"?"block":"none";
}
function setPreset(){var v=document.getElementById("preset-val").value.trim();if(v)post("preset="+encodeURIComponent(v))}
function setScale(v){setOn("seg-scale","sc_"+v);post("scale="+v)}
function setOn(g,id){
  document.querySelectorAll("#"+g+" button").forEach(function(b){b.classList.remove("on")});
  var el=document.getElementById(id);if(el)el.classList.add("on");
}
function onTog(el){tenths=el.checked;post(el.id+"="+(el.checked?1:0))}
function onColor(el){
  var m={fg_hex:"fg-lbl",bg_hex:"bg-lbl",accent_hex:"ac-lbl"};
  var lbl=document.getElementById(m[el.id]);if(lbl)lbl.textContent=el.value;
  if(el.id==="fg_hex"){fgColor=el.value;if(swState!=="finished")document.getElementById("digits").style.color=fgColor}
  if(el.id==="accent_hex"){document.getElementById("prog-bar").style.background=el.value}
  clearTimeout(db);
  db=setTimeout(function(){post(el.id+"="+el.value.slice(1))},150);
}
function save(){post("save=1").then(function(){document.getElementById("snote").textContent="Saved on the device"})}

fetch("/settings").then(function(r){return r.json()}).then(function(s){
  tenths=s.show_tenths==1;
  document.getElementById("show_tenths").checked=tenths;
  presetMs=s.preset_ms||60000;
  var ps=Math.floor(presetMs/1000);
  document.getElementById("preset-val").value=pad(Math.floor(ps/60))+":"+pad(ps%60);
  var def={fg_hex:"#00ff88",bg_hex:"#000000",accent_hex:"#ff4400"};
  var lm={fg_hex:"fg-lbl",bg_hex:"bg-lbl",accent_hex:"ac-lbl"};
  for(var k in lm){
    var el=document.getElementById(k);
    if(!el) continue;
    el.value=s[k]||def[k];
    var lb=document.getElementById(lm[k]);if(lb)lb.textContent=el.value;
  }
  fgColor=s.fg_hex||"#00ff88";
  document.getElementById("digits").style.color=fgColor;
  document.getElementById("prog-bar").style.background=s.accent_hex||"#ff4400";
  setOn("seg-scale","sc_"+(s.scale||2));
  setMode(s.mode||"stopwatch");
}).catch(function(){});

poll();
tick();
</script>
